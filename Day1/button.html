<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Button</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    font-family:Arial, sans-serif;
}

button{
    padding:16px 40px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:all .3s ease;
    box-shadow:0 10px 25px rgba(99,102,241,.35);
    position:relative;
    overflow:hidden;
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.25);
    transform:skewX(-25deg);
    transition:.6s;
}

button:hover::before{
    left:120%;
}

button:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 15px 35px rgba(99,102,241,.5);
}

button:active{
    transform:scale(.96);
}
</style>

</head>
<body>

<button>🚀 Get Started</button>

</body>
</html>
