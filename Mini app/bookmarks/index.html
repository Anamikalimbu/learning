<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmarks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="theme-blue">
    <a class="back-link" href="../index.html">All apps</a>
    <h1>Bookmarks</h1>
    <p class="lede">Save a link, tag it, and find it again in a second.</p>

    <form id="bookmark-form">
      <label
        >Title
        <input id="title" type="text" required />
      </label>
      <label
        >URL
        <input id="url" type="url" required />
      </label>
      <label
        >Tags (separate with commas)
        <input id="tags" type="text" />
      </label>
      <button id="save-button" class="primary" type="submit">
        Add bookmark
      </button>
      <button id="cancel-button" type="button" hidden>Cancel</button>
    </form>

    <input id="search" type="search" placeholder="Search bookmarks (press /)" />

    <div id="bookmark-list"></div>

    <script src="../shared.js"></script>
    <script src="script.js"></script>
  </body>
</html>
